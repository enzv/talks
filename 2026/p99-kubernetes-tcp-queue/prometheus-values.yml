alertmanager:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false

server:
  persistentVolume:
    enabled: false
  global:
    scrape_interval: 250ms
    scrape_timeout: 200ms
    evaluation_interval: 250ms

serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: tcp-notsent-poc
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - tcp-notsent-poc
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            action: keep
            regex: "true"
          - source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            target_label: __metrics_path__
            regex: (.+)
          - source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            target_label: __address__
            regex: ([^:]+)(?::[0-9]+)?;([0-9]+)
            replacement: "$1:$2"
          - source_labels:
              - __meta_kubernetes_namespace
            target_label: k8s_namespace
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: k8s_pod
          - source_labels:
              - __meta_kubernetes_pod_label_app
            target_label: k8s_app
          - source_labels:
              - __meta_kubernetes_pod_label_variant
            target_label: k8s_variant
