      containers:
      - name: server
        image: localhost/tcp-notsent-poc:e2e
        imagePullPolicy: IfNotPresent
        args:
        - -mode=server
        ports:
        - containerPort: 8080
          name: h2c
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
          runAsUser: 0
          runAsGroup: 0
---
