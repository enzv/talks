---
apiVersion: batch/v1
kind: Job
metadata:
  name: scenario-baseline
  namespace: tcp-notsent-poc
spec:
  backoffLimit: 0
  suspend: true
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
    spec:
      restartPolicy: Never
      containers:
      - name: scenario
        image: localhost/tcp-notsent-poc:e2e
        imagePullPolicy: IfNotPresent
        args:
        - -variant=baseline
        ports:
        - containerPort: 9090
          name: metrics
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: notsent-ebpf
  namespace: tcp-notsent-poc
spec:
  selector:
    matchLabels:
      app: tcp-notsent-ebpf
  template:
    metadata:
      labels:
        app: tcp-notsent-ebpf
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9091"
    spec:
      hostPID: true
      containers:
      - name: ebpf
        image: localhost/tcp-notsent-poc:e2e
        imagePullPolicy: IfNotPresent
        args:
        - -mode=ebpf
        - -variant=node
        securityContext:
          privileged: true
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            add:
            - SYS_RESOURCE
        ports:
        - containerPort: 9091
          name: metrics
        volumeMounts:
        - name: sys
          mountPath: /sys
          readOnly: true
      volumes:
      - name: sys
        hostPath:
          path: /sys
          type: Directory
---
apiVersion: batch/v1
kind: Job
metadata:
  name: scenario-notsent-128k
  namespace: tcp-notsent-poc
spec:
  backoffLimit: 0
  suspend: true
  template:
