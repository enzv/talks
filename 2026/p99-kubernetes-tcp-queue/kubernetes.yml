---
apiVersion: v1
kind: Namespace
metadata:
  name: tcp-notsent-poc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-baseline
  namespace: tcp-notsent-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tcp-notsent-server
      variant: baseline
  template:
    metadata:
      labels:
        app: tcp-notsent-server
        variant: baseline
    spec:
      securityContext:
        sysctls:
        - name: net.ipv4.tcp_notsent_lowat
          value: "4294967295"
      containers:
      - name: server
        image: localhost/tcp-notsent-poc:e2e
        imagePullPolicy: IfNotPresent
        args:
        - -mode=server
        ports:
        - containerPort: 8080
          name: h2c
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
          runAsUser: 0
          runAsGroup: 0
---
apiVersion: v1
kind: Service
metadata:
  name: server-baseline
  namespace: tcp-notsent-poc
spec:
  selector:
    app: tcp-notsent-server
    variant: baseline
  ports:
  - name: h2c
    port: 8080
    targetPort: h2c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-notsent-128k
  namespace: tcp-notsent-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tcp-notsent-server
