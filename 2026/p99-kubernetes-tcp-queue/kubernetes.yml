  name: server-notsent-128k
  namespace: tcp-notsent-poc
spec:
  selector:
    app: tcp-notsent-server
    variant: notsent-128k
  ports:
  - name: h2c
    port: 8080
    targetPort: h2c
---
apiVersion: apps/v1
