apiVersion: agents.x-k8s.io/v1alpha1
kind: Sandbox
metadata:
  name: agent-sandbox-minimal
  namespace: agent-lab
spec:
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: agent-workload-lab
        app.kubernetes.io/component: sandbox-minimal
    spec:
      containers:
        - name: agent
          image: agent-workload-lab:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          emptyDir: {}
