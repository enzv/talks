apiVersion: v1
kind: Namespace
metadata:
  name: agent-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: agent-baseline
  namespace: agent-lab
  labels:
    app.kubernetes.io/name: agent-workload-lab
    app.kubernetes.io/component: baseline
spec:
  containers:
    - name: agent
      image: agent-workload-lab:latest
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
      readinessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 2
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 5
        periodSeconds: 10
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: agent-hardened
  namespace: agent-lab
  labels:
    app.kubernetes.io/name: agent-workload-lab
    app.kubernetes.io/component: hardened
spec:
  automountServiceAccountToken: false
  runtimeClassName: gvisor
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: agent
      image: agent-workload-lab:latest
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
      readinessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 2
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 5
        periodSeconds: 10
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: workspace
      emptyDir: {}
    - name: tmp
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-baseline
  namespace: agent-lab
  labels:
    app.kubernetes.io/name: agent-workload-lab
    app.kubernetes.io/component: baseline
spec:
  selector:
    app.kubernetes.io/name: agent-workload-lab
    app.kubernetes.io/component: baseline
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: agent-hardened
  namespace: agent-lab
  labels:
    app.kubernetes.io/name: agent-workload-lab
    app.kubernetes.io/component: hardened
spec:
  selector:
    app.kubernetes.io/name: agent-workload-lab
    app.kubernetes.io/component: hardened
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hardened-default-deny
  namespace: agent-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-workload-lab
      app.kubernetes.io/component: hardened
  policyTypes:
    - Ingress
    - Egress
