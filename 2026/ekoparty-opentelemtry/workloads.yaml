          env:
            - name: OTEL_SERVICE_NAME
              value: tracking-api
            - name: CONFIG_SERVER_URL
              value: http://config-server.config.svc.cluster.local:8080
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dispatch-db-app
                  key: DATABASE_URL
            - name: PORT
              value: "8080"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
