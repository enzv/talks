apiVersion: v1
kind: Namespace
metadata:
  name: dispatch-core
---
apiVersion: v1
kind: Namespace
metadata:
  name: config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipment-api
  namespace: dispatch-core
  annotations:
    trace-lab.io/allowed-edges: |
      [
        {"target":"config-server.config.svc.cluster.local","method":"GET","path":"/*"},
        {"target":"routing-api.dispatch-core.svc.cluster.local","method":"POST","path":"/v1/routes/plan"},
        {"target":"routing-api.dispatch-core.svc.cluster.local","method":"POST","path":"/v1/routes/replan"},
        {"target":"notification-api.dispatch-core.svc.cluster.local","method":"POST","path":"/v1/notifications"}
      ]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipment-api
  template:
    metadata:
      labels:
        app: shipment-api
        app.kubernetes.io/name: shipment-api
        app.kubernetes.io/part-of: dispatch-core
      annotations:
        instrumentation.opentelemetry.io/inject-go: dispatch-instrumentation
        instrumentation.opentelemetry.io/otel-go-auto-target-exe: /app/trace-lab
    spec:
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 5
      containers:
        - name: shipment-api
          image: trace-lab:dev
          imagePullPolicy: IfNotPresent
          command: ["/app/trace-lab"]
          args: ["shipment-api"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: shipment-api
            - name: CONFIG_SERVER_URL
              value: http://config-server.config.svc.cluster.local:8080
            - name: PORT
              value: "8080"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: shipment-api
  namespace: dispatch-core
spec:
  selector:
    app: shipment-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
