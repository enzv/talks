            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-api
  namespace: dispatch-core
spec:
  selector:
    app: tracking-api
  ports:
    - name: http
