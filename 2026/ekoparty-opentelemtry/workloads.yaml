apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: config
  annotations:
    trace-lab.io/allowed-edges: '[]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
        app.kubernetes.io/name: config-server
        app.kubernetes.io/part-of: dispatch-core
      annotations:
        instrumentation.opentelemetry.io/inject-go: config-instrumentation
        instrumentation.opentelemetry.io/otel-go-auto-target-exe: /app/trace-lab
    spec:
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 5
      containers:
        - name: config-server
          image: trace-lab:dev
          imagePullPolicy: IfNotPresent
          command: ["/app/trace-lab"]
          args: ["config-server"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: config-server
            - name: TRACKING_URL
              value: http://tracking-api.dispatch-core.svc.cluster.local:8080
            - name: SHIPMENT_URL
              value: http://shipment-api.dispatch-core.svc.cluster.local:8080
            - name: INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: dispatch-internal-auth
                  key: INTERNAL_KEY
            - name: PORT
              value: "8080"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
