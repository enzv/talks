apiVersion: v1
kind: Pod
metadata:
  name: userns-demo-baseline
  labels:
    app: userns-demo
    mode: baseline
spec:
  restartPolicy: Never
  containers:
    - name: userns-attacker
      image: alpine:3.20
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          echo "[container] id: $(id)"
          echo "[container] uid_map:"; cat /proc/self/uid_map || true
          echo "[container] attempting write to /host/proof-from-container.txt"
          echo "proof: baseline wrote this" >> /host/proof-from-container.txt
          echo "[container] write OK"
          sleep 3600
      volumeMounts:
        - name: host-demo
          mountPath: /host
          readOnly: false
  volumes:
    - name: host-demo
      hostPath:
        path: /var/lib/userns-demo
        type: Directory

