apiVersion: v1
kind: Pod
metadata:
  name: old
  namespace: cg
  labels:
    app: poc
    variant: old
spec:
  shareProcessNamespace: true
  restartPolicy: Always
  volumes:
    - name: src
      configMap:
        name: src
    - name: build
      emptyDir: {}
  containers:
    - name: java
      image: eclipse-temurin:8u362-b09-jdk-alpine
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "javac -d /tmp /work/MemHog.java && exec java -cp /tmp MemHog"]
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: "1"
          memory: 256Mi
      volumeMounts:
        - name: src
          mountPath: /work
          readOnly: true
        - name: build
          mountPath: /tmp
    - name: tracer
      image: nicolaka/netshoot:v0.13
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "sleep infinity"]
      securityContext:
        runAsUser: 0
        capabilities:
          add: ["SYS_PTRACE"]
        seccompProfile:
          type: Unconfined
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
